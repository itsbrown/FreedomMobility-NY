[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Shared pay-rate store (Netlify Blobs). Must sit above the 404 catch-all.
[[redirects]]
  from = "/api/pay-rates"
  to = "/.netlify/functions/pay-rates"
  status = 200
  force = true

# Redirects for SPA-like behavior if needed, but this is fully static
[[redirects]]
  from = "/*"
  to = "/404"
  status = 404

# Form handling is automatic with data-netlify on the form
# See src/pages/contact.astro for the Netlify Forms setup

# Optional: Custom headers for security / performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"